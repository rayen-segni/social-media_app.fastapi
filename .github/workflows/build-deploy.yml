name: Build And Deploy Code
on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["feature X"]

jobs:
  build:
    environment: Testing
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          POSTGRES_DB: ${{ secrets.DATABASE_NAME_TEST }}
          POSTGRES_USER: ${{ secrets.DATABASE_USERNAME }}

        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_HOSTNAME: ${{secrets.DATABASE_HOSTNAME}}
      DATABASE_PORT: ${{secrets.DATABASE_PORT}}
      DATABASE_USERNAME: ${{secrets.DATABASE_USERNAME}}
      DATABASE_NAME: ${{secrets.DATABASE_NAME}}
      DATABASE_NAME_TEST: ${{secrets.DATABASE_NAME_TEST}}
      DATABASE_PASSWORD: ${{secrets.DATABASE_PASSWORD}}
      SECRET_KEY: ${{secrets.SECRET_KEY}}
      ALGORITHM: ${{secrets.ALGORITHM}}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${{secrets.ACCESS_TOKEN_EXPIRE_MINUTES}}
    steps:
      - 
        name: Pulling Git Repo
        uses: actions/checkout@v4
      - 
        name: Install Python Version 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - 
        name: Upgrade Pip
        run: python3 -m pip install --upgrade pip
      - 
        name: Install Dependencies
        run: pip install -r requirements.txt
      - 
        name: Run Tests With Pytest
        run: |
          pip install pytest
          pytest -v

      # # Build & Push Docker Image
      # - 
      #   name: Login to Docker Hub
      #   uses: docker/login-action@v4
      #   with:
      #     username: ${{ vars.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}
      # - 
      #   name: Set up Docker Buildx
      #   uses: docker/setup-buildx-action@v4
      # - 
      #   name: Build and push
      #   uses: docker/build-push-action@v6
      #   with:
      #     push: ${{ github.event_name != 'pull_request' }}
      #     tags: ${{ vars.DOCKERHUB_USERNAME }}/social-app-backend:latest
      #     cache-from: type=gha
      #     cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: [build]
    environment:
      name: Production
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    env:
      FASTAPI_CLOUD_TOKEN: ${{ secrets.FASTAPI_CLOUD_TOKEN }}
      FASTAPI_CLOUD_APP_ID: ${{ secrets.FASTAPI_CLOUD_APP_ID }}

    steps:
      - name: Pulling Git Repo
        uses: actions/checkout@v4

      - name: Install Python Version 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Upgrade Pip & Install FastAPI CLI
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install fastapi-cli

      - name: Sync Environment Variables to FastAPI Cloud
        run: |
          python3 -m fastapi_cli cloud env set DATABASE_HOSTNAME "${{ secrets.DATABASE_HOSTNAME }}"
          python3 -m fastapi_cli cloud env set DATABASE_PORT "${{ secrets.DATABASE_PORT }}"
          python3 -m fastapi_cli cloud env set DATABASE_USERNAME "${{ secrets.DATABASE_USERNAME }}"
          python3 -m fastapi_cli cloud env set DATABASE_NAME "${{ secrets.DATABASE_NAME }}"
          python3 -m fastapi_cli cloud env set ALGORITHM "${{ secrets.ALGORITHM }}"
          python3 -m fastapi_cli cloud env set ACCESS_TOKEN_EXPIRE_MINUTES "${{ secrets.ACCESS_TOKEN_EXPIRE_MINUTES }}"
          python3 -m fastapi_cli cloud env set --secret DATABASE_PASSWORD "${{ secrets.DATABASE_PASSWORD }}"
          python3 -m fastapi_cli cloud env set --secret SECRET_KEY "${{ secrets.SECRET_KEY }}"

      - name: Deploy to FastAPI Cloud
        run: python3 -m fastapi_cli deploy



