      #     cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: [build]
    environment:
      name: Production
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    env:
      FASTAPI_CLOUD_TOKEN: ${{ secrets.FASTAPI_CLOUD_TOKEN }}
      FASTAPI_CLOUD_APP_ID: ${{ secrets.FASTAPI_CLOUD_APP_ID }}

    steps:
    # Deploy to FastAPI Cloud Using fastapi cloud action
      - name: Pulling Git Repo
        uses: actions/checkout@v4

      - name: Deploy to FastAPI Cloud
        uses: rayen-segni/fastapi-cloud@v1
        with:
          app-id: ${{ secrets.FASTAPI_CLOUD_APP_ID }}
          token: ${{ secrets.FASTAPI_CLOUD_TOKEN }}

