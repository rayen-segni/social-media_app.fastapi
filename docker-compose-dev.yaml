version: '3.8'
services:
  social-app-backend:
    build: .
    environment:
      - DATABASE_HOSTNAME=postgres
    depends_on:
      - postgres
    image: rayen4dev/social-media-app:latest
    volumes:
      - ./:/app:ro
    command: [ "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload" ]
    ports:
      - 8000:8000
    env_file:
      - ./.env
  postgres:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: rayen
      POSTGRES_DB: social_media_app
    volumes:
      - postgres-db:/var/lib/postgresql

volumes:
  postgres-db:
