version: '3.8'
services:
  social-app-backend:
    image: rayen4dev/social-app-backend:latest
    depends_on:
      - postgres
    # command: [ "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000" ]
    ports:
      - 80:8000
    env_file:
      - ~/.env
  postgres:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: rayen
      POSTGRES_DB: social_media_app
    volumes:
      - postgres-db:/var/lib/postgresql

volumes:
  postgres-db:
